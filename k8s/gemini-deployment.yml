kind: Deployment
apiVersion: apps/v1
metadata:
  name: gemini-deployment
  namespace: gemini
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gemini
  template:
    metadata:
      labels:
        app: gemini
    spec:
      containers:
      - name: gemini-clone
        image: mrsinghdocker/gemini-clone:1
        ports:
        - containerPort: 3000
        envFrom:
          - configMapRef:
              name: gemini-configmap
          - secretRef:
              name: gemini-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"